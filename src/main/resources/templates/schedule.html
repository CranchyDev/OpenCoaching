<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{baselayout}">
<body>

    <div layout:fragment="content" class="container">
        <h1>Coaching Schedule</h1>

        <div th:if="${coachingSession != null}" style="margin-bottom: 2rem; padding: 1rem; border: 1px solid #ccc; border-radius: 8px;">
            <h2>Edit Session #<span th:text="${coachingSession.id}"></span></h2>
            <form th:action="@{/schedule-coaching/{id}(id=${coachingSession.id})}" method="POST">
        
                <div>
                    <label>Player Rank:</label>
                    <select name="rank">
                        <option value="iron" th:selected="${coachingSession.rank == 'iron'}">Iron</option>
                        <option value="bronze" th:selected="${coachingSession.rank == 'bronze'}">Bronze</option>
                        <option value="silver" th:selected="${coachingSession.rank == 'silver'}">Silver</option>
                        <option value="gold" th:selected="${coachingSession.rank == 'gold'}">Gold</option>
                        <option value="platinum" th:selected="${coachingSession.rank == 'platinum'}">Platinum</option>
                        <option value="emerald" th:selected="${coachingSession.rank == 'emerald'}">Emerald</option>
                        <option value="diamond" th:selected="${coachingSession.rank == 'diamond'}">Diamond</option>
                        <option value="master" th:selected="${coachingSession.rank == 'master'}">Master</option>
                        <option value="grandmaster" th:selected="${coachingSession.rank == 'grandmaster'}">Grandmaster</option>
                        <option value="challenger" th:selected="${coachingSession.rank == 'challenger'}">Challenger</option>
                    </select>
        </div>

        <div>
            <label>Duration (Hours):</label>
            <select name="hours">
                <option value="1" th:selected="${coachingSession.hours == 1}">1 Hour</option>
                <option value="2" th:selected="${coachingSession.hours == 2}">2 Hours</option>
                <option value="3" th:selected="${coachingSession.hours == 3}">3 Hours</option>
                <option value="4" th:selected="${coachingSession.hours == 4}">4 Hours</option>
                <option value="5" th:selected="${coachingSession.hours == 5}">5 Hours</option>
                <option value="6" th:selected="${coachingSession.hours == 6}">6 Hours</option>
            </select>
        </div>

        <div>
            <label>Assigned Coach:</label>
            <select name="coach">
                <option th:each="c : ${coaches}" 
                        th:value="${c}" 
                        th:text="${c}" 
                        th:selected="${c == coachingSession.coach}">
                </option>
            </select>
        </div>
        
        <br />
        <button type="submit" class="btn-edit">Save Changes</button>
        <a th:href="@{/schedule}" style="margin-left: 10px;">Cancel</a>
    </form>
</div>

        <table th:if="${not #lists.isEmpty(sessions)}">
            <thead>
                <tr>
                    <th>Session ID</th>
                    <th>Player Rank</th>
                    <th>Duration (Hours)</th>
                    <th>Assigned Coach</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="coachingSession : ${sessions}">
                    <td th:text="${coachingSession.id}">1</td>
                    <td th:text="${coachingSession.rank}">Rank</td>
                    <td th:text="${coachingSession.hours}">1Hour</td>
                    <td th:text="${coachingSession.coach}">Coach</td>
                    <td>
                        <a th:href="@{/schedule-edit/{id}(id=${coachingSession.id})}" class="btn-edit">Edit</a>
                        <form th:action="@{/schedule-remove/{id}(id=${coachingSession.id})}" method="POST" style="display:inline;">
                            <button type="submit" class="btn-delete" onclick="return confirm('Are you sure you want to delete this session?');">Remove</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(sessions)}" style="color: var(--text-muted); margin-top: 1.5rem;">
            No coaching sessions have been scheduled yet.
        </p>
    </div>

</body>
</html>
